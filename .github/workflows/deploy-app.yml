name: Deploy Flutter App to Vercel
on:
  push:
    branches: [ main, dev, dev-redesign ]
    paths-ignore: [ 'README.md', '.gitignore' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set Supabase Environment
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }}" >> $GITHUB_ENV
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_PROD }}" >> $GITHUB_ENV
          else
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV }}" >> $GITHUB_ENV
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY_DEV }}" >> $GITHUB_ENV
          fi

      - name: Generate Firebase config files
        run: |
          cat > lib/firebase_options.dart << 'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show kIsWeb;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) { return web; }
              throw UnsupportedError('DefaultFirebaseOptions are not configured for this platform.');
            }
            static const FirebaseOptions web = FirebaseOptions(
              apiKey: '${{ secrets.FIREBASE_API_KEY }}',
              appId: '${{ secrets.FIREBASE_APP_ID }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              authDomain: '${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com',
              storageBucket: '${{ secrets.FIREBASE_PROJECT_ID }}.firebasestorage.app',
            );
          }
          DART

          cat > web/firebase-messaging-sw.js << SWJS
          importScripts('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js');
          importScripts('https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js');
          firebase.initializeApp({
              apiKey: "${{ secrets.FIREBASE_API_KEY }}",
              authDomain: "${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com",
              projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
              storageBucket: "${{ secrets.FIREBASE_PROJECT_ID }}.firebasestorage.app",
              messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
              appId: "${{ secrets.FIREBASE_APP_ID }}"
          });
          const messaging = firebase.messaging();
          messaging.onBackgroundMessage((payload) => {
              const data = payload.data || {};
              const notif = payload.notification || {};
              const title = data.title || notif.title || 'Grace Note';
              const body = data.body || notif.body || '';
              const tag = data.tag || 'grace-note-default';
              const link = data.link || '/';
              return self.registration.showNotification(title, {
                  body,
                  icon: '/icons/Icon-192.png',
                  badge: '/icons/notification-logo-icon.png',
                  tag,
                  renotify: true,
                  data: { link },
              });
          });
          self.addEventListener('notificationclick', (event) => {
              event.notification.close();
              const link = event.notification.data?.link || '/';
              event.waitUntil(
                  clients.matchAll({ type: 'window', includeUncontrolled: true }).then((windowClients) => {
                      for (const client of windowClients) {
                          if (client.url.includes(self.location.origin) && 'focus' in client) {
                              return client.focus();
                          }
                      }
                      return clients.openWindow(link);
                  })
              );
          });
          SWJS

      - name: Build Flutter Web
        run: |
          touch .env
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ env.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }} \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          zeit-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: build/web

      - name: Deploy to Vercel (Preview / Dev)
        if: github.ref != 'refs/heads/main'
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          zeit-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # --prod 없이 배포하면 Vercel이 브랜치별 고유 Preview URL을 생성.
          # main 배포 후에도 dev는 항상 dev Supabase 환경으로 격리됨.
          vercel-args: '--target preview'
          alias-domains: grace-note-app-pwa-asg0416-asg0416s-projects.vercel.app
          working-directory: build/web
